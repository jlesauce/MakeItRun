name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier que le tag correspond à la version déclarée
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          major=$(sed -n 's/^makeItRun\.versionMajor=//p' gradle.properties)
          minor=$(sed -n 's/^makeItRun\.versionMinor=//p' gradle.properties)
          declared="v$major.$minor"
          if [ "$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à $declared" >&2
            exit 1
          fi

      - name: Restaurer le matériel de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > makeitrun-release.jks
          {
            echo "storeFile=makeitrun-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Lancer les tests unitaires
        run: ./gradlew :app:testDebugUnitTest

      - name: Construire l'APK signé
        run: ./gradlew :app:assembleRelease

      - name: Nommer l'artefact
        run: |
          mkdir -p artefacts
          cp app/build/outputs/apk/release/app-release.apk \
            "artefacts/MakeItRun-$GITHUB_REF_NAME.apk"

      - name: Effacer le matériel de signature
        if: always()
        run: rm -f makeitrun-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: MakeItRun-${{ github.ref_name }}
          path: artefacts/*.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="$(mktemp)"
          {
            cat <<'EOF'
          Téléchargez le fichier `.apk` ci-dessous et ouvrez-le sur votre téléphone.
          Android demandera l'autorisation d'installer une application issue d'une
          source inconnue : c'est normal pour une distribution hors Play Store.

          Il vous faut un tapis de course compatible FTMS. Un capteur de fréquence
          cardiaque Bluetooth est facultatif, et nécessaire seulement pour les étapes
          qui visent une plage de fréquence.

          EOF
            awk -v ver="${tag#v}" '
              $0 ~ "^## " {
                in_section = ($0 ~ "^## v?" ver "( |$)")
                next
              }
              in_section { print }
            ' RELEASE_NOTES.md
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artefacts/*.apk --clobber
            gh release edit "$tag" \
              --title "Make It Run $tag" \
              --notes-file "$notes"
          else
            gh release create "$tag" \
              --title "Make It Run $tag" \
              --notes-file "$notes" \
              artefacts/*.apk
          fi
