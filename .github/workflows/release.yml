name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v5

      - name: Rendre le wrapper Gradle exécutable
        run: chmod +x gradlew

      - name: Lire la version déclarée
        id: version
        run: |
          major=$(sed -n 's/^makeItRun\.versionMajor=//p' gradle.properties)
          minor=$(sed -n 's/^makeItRun\.versionMinor=//p' gradle.properties)
          if [ -z "$major" ] || [ -z "$minor" ]; then
            echo "Version introuvable dans gradle.properties." >&2
            exit 1
          fi
          echo "tag=v${major}.${minor}" >> "$GITHUB_OUTPUT"

      - name: Vérifier le tag
        env:
          DECLARED: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$DECLARED" != "$GITHUB_REF_NAME" ]; then
              echo "Le tag $GITHUB_REF_NAME ne correspond pas à $DECLARED." >&2
              exit 1
            fi
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${DECLARED}" >/dev/null; then
            tagged=$(git rev-parse "${DECLARED}^{}")
            head=$(git rev-parse HEAD)
            if [ "$tagged" != "$head" ]; then
              echo "Le tag ${DECLARED} existe déjà et pointe sur un autre commit." >&2
              exit 1
            fi
          fi

      - name: Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Restaurer le matériel de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Un secret de signature est manquant (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > makeitrun-release.jks
          if [ ! -s makeitrun-release.jks ]; then
            echo "Le keystore décodé est vide." >&2
            exit 1
          fi
          {
            echo "storeFile=makeitrun-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Construire l'APK signé
        run: ./gradlew :app:assembleRelease

      - name: Nommer l'artefact
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p artefacts
          cp app/build/outputs/apk/release/app-release.apk \
            "artefacts/MakeItRun-$RELEASE_TAG.apk"

      - name: Effacer le matériel de signature
        if: always()
        run: rm -f makeitrun-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: MakeItRun-${{ steps.version.outputs.tag }}
          path: artefacts/*.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          notes="$(mktemp)"
          {
            cat <<'EOF'
          Téléchargez le fichier `.apk` ci-dessous et ouvrez-le sur votre téléphone.
          Android demandera l'autorisation d'installer une application issue d'une
          source inconnue : c'est normal pour une distribution hors Play Store.

          Il vous faut un tapis de course compatible FTMS. Un capteur de fréquence
          cardiaque Bluetooth est facultatif, et nécessaire seulement pour les étapes
          qui visent une plage de fréquence.

          EOF
            awk -v ver="${tag#v}" '
              $0 ~ "^## " {
                in_section = ($0 ~ "^## v?" ver "( |$)")
                next
              }
              in_section { print }
            ' RELEASE_NOTES.md
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artefacts/*.apk --clobber
            gh release edit "$tag" \
              --title "Make It Run $tag" \
              --notes-file "$notes"
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Make It Run $tag" \
              --notes-file "$notes" \
              artefacts/*.apk
          fi
